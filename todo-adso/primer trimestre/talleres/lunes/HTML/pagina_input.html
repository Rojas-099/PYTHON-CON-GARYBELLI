<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ejemplos de todos los tipos de input en HTML</h1>
    <form>
        <label for="text">Text:</label>
        <input type="text" id="text" name="text" required><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="url">Dirección web (URL):</label>
        <input type="url" id="url" name="url" required><br><br>

        <label for="tel">Teléfono o Celular:</label>
        <input type="tel" id="tel" name="tel" required><br><br>

        <label for="number">Numero:</label>
        <input type="number" id="number" name="number" required><br><br>

        <label for="range">Rango:</label>
        <input type="range" id="range" name="range"><br><br>

        <label for="date">Fecha:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="datetime-local">Fecha específica:</label>
        <input type="datetime-local" id="datetime-local" name="datetime-local" required><br><br>

        <label for="month">Mes:</label>
        <input type="month" id="month" name="month" required><br><br>

        <label for="week">Semana:</label>
        <input type="week" id="week" name="week" required><br><br>

        <label for="time">Hora:</label>
        <input type="time" id="time" name="time" required><br><br>

        <label for="search">Busqueda:</label>
        <input type="search" id="search" name="search" required><br><br>

        <label for="color">Color:</label>
        <input type="color" id="color" name="color"><br><br>

        <label for="checkbox">Checkbox (marcar o desmarcar):</label>
        <input type="checkbox" id="checkbox" name="checkbox"><br><br>

        <label for="radio1">Radio 1:</label>
        <input type="radio" id="radio1" name="radio" value="1">
        <label for="radio2">Radio 2:</label>
        <input type="radio" id="radio2" name="radio" value="2"><br><br>

        <label for="file">Archivo:</label>
        <input type="file" id="file" name="file"><br><br>

        <button type="submit">Guardar</button>
        <button type="reset">Resetear</button>
        <button>Botón</button>
        <input type="hidden" name="hidden" value="hidden"> para enviar datos ocultos al servidor
        <p></p>
        <img src="#" alt="" width="100" height="100"> para poner una imagen en el formulario
    </form>
</body>
</html>
